# 部署免費試用的代理到 Cloudflare Workers（規格 12.39）：push 到 main 且代理有改動時執行，也可以手動執行。
#
# 代理只轉送對話、不保存內容；D1 只存邀請碼與憑證的雜湊、帳號代號、每天的次數、每月的用量（apps/proxy/src/store.ts）。
# 帳號相關的值不寫進 repo：
#   repo 的 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（和同步服務同一組）
#                    PROXY_ANTHROPIC_API_KEY（Anthropic Console 的 API key，按用量計費的那種）
#                    PROXY_ADMIN_TOKEN（管理端點的憑證，自己產生一串夠長的亂數；tools/proxy-admin.ts 用它產生邀請碼）
#   repo 的 Variables：PROXY_D1_DATABASE_ID（D1 資料庫的 id）
#                      PROXY_POLICY（選填：覆寫政策的 JSON，例 {"dailyMessages":20}；沒設定時用 apps/proxy/src/policy.ts 的預設）
#   允許的網頁來源沿用 WEB_URL。
# 還沒設定 PROXY_D1_DATABASE_ID 時只跑測試，不部署。
# 部署完成後，把 Workers 的網址設成 Variables 的 PROXY_URL，WEB_FEATURES 加上 trial，再手動執行一次「Deploy web app」。
# secrets 從 stdin 給 wrangler，不印出。staging 的代理另外由 staging.yml 部署。
name: Deploy proxy

on:
  push:
    branches: [main]
    paths:
      - apps/proxy/**
      - packages/core/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - tools/proxy-config.ts
      - tools/sync-config.ts
      - .github/workflows/proxy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        # 偶爾卡住不動（9.4「部署偶爾卡在 npm ci」）：5 分鐘沒完成就失敗，重跑即可
        timeout-minutes: 5
      - run: npm run typecheck -w @running-coach/proxy
      - run: npx vitest run apps/proxy tools/test/proxy-tools.test.ts
      - name: Fill in account values
        if: ${{ vars.PROXY_D1_DATABASE_ID != '' }}
        env:
          DATABASE_ID: ${{ vars.PROXY_D1_DATABASE_ID }}
          # 只允許正式的網址（staging 有自己的代理）
          WEB_URLS: ${{ vars.WEB_URL }}
          PROXY_POLICY: ${{ vars.PROXY_POLICY }}
        run: npx tsx tools/proxy-config.ts
      - name: Check secrets
        if: ${{ vars.PROXY_D1_DATABASE_ID != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.PROXY_ANTHROPIC_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.PROXY_ADMIN_TOKEN }}
        # 只檢查有沒有設定，不印內容
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::要先設定 Secrets 的 PROXY_ANTHROPIC_API_KEY 與 PROXY_ADMIN_TOKEN"
            exit 1
          fi
      - name: Deploy
        if: ${{ vars.PROXY_D1_DATABASE_ID != '' }}
        working-directory: apps/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 釘住確切版本：這一步拿著 Cloudflare 的 API token
        run: npx --yes wrangler@4.148.0 deploy
      - name: Secrets
        if: ${{ vars.PROXY_D1_DATABASE_ID != '' }}
        working-directory: apps/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.PROXY_ANTHROPIC_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.PROXY_ADMIN_TOKEN }}
        # 從 stdin 給，不印出
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@4.148.0 secret put ANTHROPIC_API_KEY > /dev/null
          printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler@4.148.0 secret put ADMIN_TOKEN > /dev/null
          echo "已寫入代理的 secrets"
      - name: Not configured
        if: ${{ vars.PROXY_D1_DATABASE_ID == '' }}
        run: echo "還沒設定 PROXY_D1_DATABASE_ID，只跑測試、不部署（設定步驟見規格 12.39）。"
