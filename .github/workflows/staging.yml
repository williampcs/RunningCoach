# staging（規格 12.19）：push 到 v2 時自動部署，使用者在 staging 試過沒問題，再說「合併部署」到正式環境。
#
# staging 和正式環境完全分開：網頁版是另一個 Cloudflare Pages 專案（正式分支是 v2），同步服務是另一個
# Worker（running-coach-sync-staging）與 D1，測試的資料不碰正式的。網頁版標示「Staging」。
# 帳號相關的值都在 repo 的 Variables，不寫進 repo；Secrets 和正式環境同一組（CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID）：
#   STAGING_PAGES_PROJECT        staging 的 Pages 專案名稱（第一次部署時建立）
#   STAGING_WEB_URL              staging 的網址（https://staging.zone2mate.com），同步服務只允許它
#   STAGING_SYNC_D1_DATABASE_ID  staging 的 D1 資料庫的 id
#   STAGING_SYNC_URL             staging 同步服務的網址（https://running-coach-sync-staging.<子網域>.workers.dev）
#   STAGING_INTERVALS_CLIENT_ID  用 Intervals.icu 登入的 client_id（選填，規格 12.37）；client_secret 在 Secrets 的 STAGING_INTERVALS_CLIENT_SECRET
#   STAGING_PROXY_D1_DATABASE_ID 免費試用的代理（規格 12.39）的 D1 的 id；Worker 是 running-coach-proxy-staging
#   STAGING_PROXY_URL            staging 代理的網址（https://running-coach-proxy-staging.<子網域>.workers.dev），網頁版建置用
#   STAGING_PROXY_POLICY         選填：覆寫代理政策的 JSON
#   代理的 Secrets：STAGING_PROXY_ADMIN_TOKEN（必填）；Anthropic 的 key 用 STAGING_PROXY_ANTHROPIC_API_KEY，沒有時用正式的 PROXY_ANTHROPIC_API_KEY
# 沒設定的部分跳過、不失敗：沒有 STAGING_PAGES_PROJECT 不部署網頁版；沒有 D1 的 id 或 STAGING_WEB_URL 不部署同步服務；
# 沒有 STAGING_PROXY_D1_DATABASE_ID 或 STAGING_WEB_URL 不部署代理。
# 設定步驟見規格 12.19。改了 Variables 之後手動執行一次。
name: Deploy staging

on:
  push:
    branches: [v2]
    paths:
      - apps/web/**
      - apps/sync/**
      - apps/proxy/**
      - packages/core/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - tools/sync-config.ts
      - tools/proxy-config.ts
      - .github/workflows/staging.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck and test
    # 手動執行時也只部署 v2：staging 就是 v2 的樣子
    if: ${{ github.ref_name == 'v2' && (vars.STAGING_PAGES_PROJECT != '' || vars.STAGING_SYNC_D1_DATABASE_ID != '' || vars.STAGING_PROXY_D1_DATABASE_ID != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        # 偶爾卡住不動（9.4「部署偶爾卡在 npm ci」）：5 分鐘沒完成就失敗，重跑即可
        timeout-minutes: 5
      - run: npm run typecheck
      - run: npm test

  sync:
    name: Deploy staging sync service
    needs: test
    if: ${{ vars.STAGING_SYNC_D1_DATABASE_ID != '' && vars.STAGING_WEB_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        # 偶爾卡住不動（9.4「部署偶爾卡在 npm ci」）：5 分鐘沒完成就失敗，重跑即可
        timeout-minutes: 5
      - name: Fill in account values
        env:
          WORKER_NAME: running-coach-sync-staging
          DATABASE_NAME: running-coach-sync-staging
          DATABASE_ID: ${{ vars.STAGING_SYNC_D1_DATABASE_ID }}
          # 只允許 staging 的網址；正式的網址連的是正式的同步服務
          WEB_URLS: ${{ vars.STAGING_WEB_URL }}
          INTERVALS_CLIENT_ID: ${{ vars.STAGING_INTERVALS_CLIENT_ID }}
        run: npx tsx tools/sync-config.ts
      - name: Deploy
        working-directory: apps/sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 釘住確切版本：這一步拿著 Cloudflare 的 API token
        run: npx --yes wrangler@4.148.0 deploy
      - name: Intervals.icu client secret
        # 用 Intervals.icu 登入（規格 12.37）：有 client_id 時把 client_secret 寫成 Worker 的 secret。從 stdin 給，不印出
        if: ${{ vars.STAGING_INTERVALS_CLIENT_ID != '' }}
        working-directory: apps/sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERVALS_CLIENT_SECRET: ${{ secrets.STAGING_INTERVALS_CLIENT_SECRET }}
        run: |
          if [ -z "$INTERVALS_CLIENT_SECRET" ]; then
            echo "::warning::有 Intervals.icu 的 client_id、沒有 STAGING_INTERVALS_CLIENT_SECRET：登入會失敗（回「沒有設定」）"
            exit 0
          fi
          printf '%s' "$INTERVALS_CLIENT_SECRET" | npx --yes wrangler@4.148.0 secret put INTERVALS_CLIENT_SECRET > /dev/null
          echo "已寫入 Intervals.icu 的 client_secret"

  proxy:
    name: Deploy staging proxy
    needs: test
    if: ${{ vars.STAGING_PROXY_D1_DATABASE_ID != '' && vars.STAGING_WEB_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        # 偶爾卡住不動（9.4「部署偶爾卡在 npm ci」）：5 分鐘沒完成就失敗，重跑即可
        timeout-minutes: 5
      - name: Fill in account values
        env:
          WORKER_NAME: running-coach-proxy-staging
          DATABASE_NAME: running-coach-proxy-staging
          DATABASE_ID: ${{ vars.STAGING_PROXY_D1_DATABASE_ID }}
          # 只允許 staging 的網址
          WEB_URLS: ${{ vars.STAGING_WEB_URL }}
          PROXY_POLICY: ${{ vars.STAGING_PROXY_POLICY }}
        run: npx tsx tools/proxy-config.ts
      - name: Check secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.STAGING_PROXY_ANTHROPIC_API_KEY || secrets.PROXY_ANTHROPIC_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.STAGING_PROXY_ADMIN_TOKEN }}
        # 只檢查有沒有設定，不印內容
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::要先設定 Secrets 的 STAGING_PROXY_ADMIN_TOKEN 與 PROXY_ANTHROPIC_API_KEY（或 STAGING_PROXY_ANTHROPIC_API_KEY）"
            exit 1
          fi
      - name: Deploy
        working-directory: apps/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 釘住確切版本：這一步拿著 Cloudflare 的 API token
        run: npx --yes wrangler@4.148.0 deploy
      - name: Secrets
        working-directory: apps/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.STAGING_PROXY_ANTHROPIC_API_KEY || secrets.PROXY_ANTHROPIC_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.STAGING_PROXY_ADMIN_TOKEN }}
        # 從 stdin 給，不印出
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@4.148.0 secret put ANTHROPIC_API_KEY > /dev/null
          printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler@4.148.0 secret put ADMIN_TOKEN > /dev/null
          echo "已寫入 staging 代理的 secrets"

  web:
    name: Deploy staging web app
    # 同步服務與代理先部署（沒設定時跳過），網頁版接著部署；其中一個失敗時網頁版也不部署
    needs: [test, sync, proxy]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.sync.result != 'failure' && needs.proxy.result != 'failure' && vars.STAGING_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the sync and proxy addresses
        env:
          STAGING_SYNC_URL: ${{ vars.STAGING_SYNC_URL }}
          SYNC_URL: ${{ vars.SYNC_URL }}
          STAGING_PROXY_URL: ${{ vars.STAGING_PROXY_URL }}
          PROXY_URL: ${{ vars.PROXY_URL }}
        # staging 不能連到正式的同步服務與代理（測試的資料與用量不碰正式的）
        run: |
          if [ -n "$STAGING_SYNC_URL" ] && [ "${STAGING_SYNC_URL%/}" = "${SYNC_URL%/}" ]; then
            echo "::error::STAGING_SYNC_URL 和正式的 SYNC_URL 相同，請改成 staging 的同步服務的網址"
            exit 1
          fi
          if [ -n "$STAGING_PROXY_URL" ] && [ "${STAGING_PROXY_URL%/}" = "${PROXY_URL%/}" ]; then
            echo "::error::STAGING_PROXY_URL 和正式的 PROXY_URL 相同，請改成 staging 的代理的網址"
            exit 1
          fi
      - run: npm ci
        # 偶爾卡住不動（9.4「部署偶爾卡在 npm ci」）：5 分鐘沒完成就失敗，重跑即可
        timeout-minutes: 5
      - run: npm run build -w @running-coach/web -- --base /
        env:
          VITE_STAGING: "1"
          # 沒設定 STAGING_SYNC_URL 時，staging 的設定頁顯示同步服務「還沒設定」，不會連到正式的同步服務
          VITE_SYNC_URL: ${{ vars.STAGING_SYNC_URL }}
          # 用 Intervals.icu 登入（規格 12.37）：沒有設定時按鈕不出現
          VITE_INTERVALS_CLIENT_ID: ${{ vars.STAGING_INTERVALS_CLIENT_ID }}
          # 免費試用（規格 12.39）：staging 的功能開關全開，有代理的網址就出現
          VITE_PROXY_URL: ${{ vars.STAGING_PROXY_URL }}
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.STAGING_PAGES_PROJECT }}
        # 釘住確切版本：這一步拿著 Cloudflare 的 API token。第一次執行時建立專案（正式分支是 v2）
        run: |
          npx --yes wrangler@4.148.0 pages project create "$PROJECT" --production-branch v2 || echo "專案已經存在，直接部署"
          npx --yes wrangler@4.148.0 pages deploy apps/web/dist --project-name "$PROJECT" --branch v2 --commit-dirty=true
