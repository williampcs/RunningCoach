# 網頁版的預覽（規格 12.13）：手動執行，把選的分支（例如 v2）部署到 Cloudflare Pages 的預覽網址
# https://<分支>.<專案>.pages.dev，合併到 main 之前先在手機與電腦上試。
#
# 預覽版的資料和正式版分開存（網址不同），也不連多裝置同步：還沒上線的程式不碰雲端的同步資料。
# 需要 repo 的 Variables：WEB_PAGES_PROJECT；Secrets 和正式版相同。
name: Deploy web preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Build and deploy preview
    if: ${{ vars.WEB_PAGES_PROJECT != '' && github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @running-coach/web -- --base /
        env:
          VITE_PREVIEW: "1"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.WEB_PAGES_PROJECT }}
          BRANCH: ${{ github.ref_name }}
        # 釘住確切版本：這一步拿著 Cloudflare 的 API token
        run: npx --yes wrangler@4.148.0 pages deploy apps/web/dist --project-name "$PROJECT" --branch "$BRANCH" --commit-dirty=true
