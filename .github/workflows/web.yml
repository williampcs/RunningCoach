# 部署網頁版到 Cloudflare Pages：push 到 main 且網頁版或核心有改動時執行，也可以手動執行（規格 12.13、KI-026）。
#
# 網頁版建置出來是靜態檔案；對話、訓練紀錄與金鑰都留在使用者的瀏覽器，不經過這裡。
# repo 的 Variables 有 WEB_PAGES_PROJECT（Pages 專案名稱）時才部署；用的是同步服務那組 Secrets：
# CLOUDFLARE_API_TOKEN（要有 Cloudflare Pages 的編輯權限）、CLOUDFLARE_ACCOUNT_ID。
# 原本的 GitHub Pages 已經收掉（2026-10-23，規格 12.13）。
# 改了 Variables 的 SYNC_URL 或 WEB_URL 之後，要手動執行一次。
# WEB_URL 是正式的網址（app.zone2mate.com）：從其他網址（舊的 pages.dev）打開時顯示搬家的提示（規格 12.19）。
# staging 由 staging.yml 在 push 到 v2 時部署到另一個 Pages 專案。
name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/core/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - .github/workflows/web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  cloudflare:
    name: Deploy to Cloudflare Pages
    needs: test
    if: ${{ vars.WEB_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 網站在網域的根目錄；_headers（安全標頭）由建置產生
      - run: npm run build -w @running-coach/web -- --base /
        env:
          VITE_SYNC_URL: ${{ vars.SYNC_URL }}
          VITE_WEB_URL: ${{ vars.WEB_URL }}
          # 功能開關（規格 12.25）：正式版只開使用者說要上線的，逗號分隔（例：multisport）；沒設定時全關
          VITE_FEATURES: ${{ vars.WEB_FEATURES }}
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.WEB_PAGES_PROJECT }}
        # 釘住確切版本：這一步拿著 Cloudflare 的 API token。第一次執行時建立專案（已經存在時會說已存在，繼續）
        run: |
          npx --yes wrangler@4.148.0 pages project create "$PROJECT" --production-branch main || echo "專案已經存在，直接部署"
          npx --yes wrangler@4.148.0 pages deploy apps/web/dist --project-name "$PROJECT" --branch main --commit-dirty=true
