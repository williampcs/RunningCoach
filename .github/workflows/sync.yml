# 部署多裝置同步服務到 Cloudflare Workers（規格 12.10）：push 到 main 且同步服務有改動時執行，也可以手動執行。
#
# 同步服務只存加密後的資料；不記錄請求（wrangler.toml 關閉了觀測日誌）。
# 帳號相關的值不寫進 repo：
#   repo 的 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
#   repo 的 Variables：SYNC_D1_DATABASE_ID（D1 資料庫的 id）
#   用 Intervals.icu 登入（選填，規格 12.37）：Variables 的 INTERVALS_CLIENT_ID、Secrets 的 INTERVALS_CLIENT_SECRET；
#   沒有設定時登入的按鈕不出現。改了要手動執行一次這裡與「Deploy web app」
# 還沒設定 SYNC_D1_DATABASE_ID 時只跑測試，不部署。
# 部署完成後，把 Workers 的網址設成 repo 的 Variables：SYNC_URL，再手動執行一次「Deploy web app」。
# Variables 的 WEB_URL（網頁版的網址）或 OLD_WEB_URL（搬家期間的舊網址）改了要再手動執行一次這裡。
# staging 的同步服務另外由 staging.yml 部署（規格 12.19）。
name: Deploy sync service

on:
  push:
    branches: [main]
    paths:
      - apps/sync/**
      - packages/core/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - tools/sync-config.ts
      - .github/workflows/sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        # 偶爾卡住不動（9.4「部署偶爾卡在 npm ci」）：5 分鐘沒完成就失敗，重跑即可
        timeout-minutes: 5
      - run: npm run typecheck -w @running-coach/sync
      - run: npx vitest run apps/sync
      - name: Fill in account values
        if: ${{ vars.SYNC_D1_DATABASE_ID != '' }}
        env:
          DATABASE_ID: ${{ vars.SYNC_D1_DATABASE_ID }}
          # 允許的網頁來源：正式的網址（WEB_URL）；搬家期間加上舊網址（OLD_WEB_URL，規格 12.19）。
          # staging 的網址不在裡面（staging 有自己的同步服務）。沒有任何網址或不是 https 時失敗、不部署
          WEB_URLS: ${{ vars.WEB_URL }} ${{ vars.OLD_WEB_URL }}
          INTERVALS_CLIENT_ID: ${{ vars.INTERVALS_CLIENT_ID }}
        run: npx tsx tools/sync-config.ts
      - name: Deploy
        if: ${{ vars.SYNC_D1_DATABASE_ID != '' }}
        working-directory: apps/sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 釘住確切版本：這一步拿著 Cloudflare 的 API token
        run: npx --yes wrangler@4.148.0 deploy
      - name: Intervals.icu client secret
        # 用 Intervals.icu 登入（規格 12.37）：有 client_id 時把 client_secret 寫成 Worker 的 secret。從 stdin 給，不印出
        if: ${{ vars.SYNC_D1_DATABASE_ID != '' && vars.INTERVALS_CLIENT_ID != '' }}
        working-directory: apps/sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERVALS_CLIENT_SECRET: ${{ secrets.INTERVALS_CLIENT_SECRET }}
        run: |
          if [ -z "$INTERVALS_CLIENT_SECRET" ]; then
            echo "::warning::有 Intervals.icu 的 client_id、沒有 INTERVALS_CLIENT_SECRET：登入會失敗（回「沒有設定」）"
            exit 0
          fi
          printf '%s' "$INTERVALS_CLIENT_SECRET" | npx --yes wrangler@4.148.0 secret put INTERVALS_CLIENT_SECRET > /dev/null
          echo "已寫入 Intervals.icu 的 client_secret"
      - name: Not configured
        if: ${{ vars.SYNC_D1_DATABASE_ID == '' }}
        run: echo "還沒設定 SYNC_D1_DATABASE_ID，只跑測試、不部署（設定步驟見規格 12.10）。"
