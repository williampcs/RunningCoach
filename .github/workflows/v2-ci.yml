# v2 的 CI：在 GitHub 代管的 runner 上執行，不碰 VM。
# deploy.yml 只在 push 到 main 時於 VM 的 self-hosted runner 上執行，與這裡無關。
name: v2 CI

on:
  push:
    branches: [v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        # 偶爾卡住不動（9.4「部署偶爾卡在 npm ci」）：5 分鐘沒完成就失敗，重跑即可
        timeout-minutes: 5
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspaces --if-present

  discord-image:
    name: Build Discord image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # 只驗證能建置，不推送到 registry（部署方式見 KI-023）
      - run: docker build -f apps/discord/Dockerfile -t running-coach-bot .
