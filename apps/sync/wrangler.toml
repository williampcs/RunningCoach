# Cloudflare Workers 的部署設定（規格 12.10）。
# 部署由 GitHub Actions 進行（.github/workflows/sync.yml），database_id 與 ALLOWED_ORIGINS
# 在部署時由 repo 的變數填入，不寫在這裡；本機手動部署時自己填。
name = "running-coach-sync"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# 不保留請求日誌（含 IP）
workers_dev = true

[observability]
enabled = false

# 每小時整理一次：清掉沒在用的空空間、過期的配對碼與頻率限制的計數；接近上限時留下警告（handler.ts 的 maintain）
[triggers]
crons = ["17 * * * *"]

[vars]
ALLOWED_ORIGINS = ""
# 用 Intervals.icu 登入（規格 12.37）：部署時由 Variables 填入；client_secret 是 Worker 的 secret（wrangler secret put），不寫在這裡
INTERVALS_CLIENT_ID = ""
# 整個服務每天估算最多寫入幾列（規格 12.10；Cloudflare 免費方案整個帳號每天 10 萬列）：部署時填入，空的用程式裡的預設 40000
DAILY_WRITE_BUDGET = ""
# 人機驗證（Turnstile）：網頁版有 site key 時部署填成 "on"，Worker 才驗證；secret key 是 Worker 的 secret（TURNSTILE_SECRET_KEY，部署時寫入），不寫在這裡
TURNSTILE = ""

[[d1_databases]]
binding = "DB"
database_name = "running-coach-sync"
database_id = ""
